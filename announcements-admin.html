<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#eef6fa" />
<meta name="robots" content="noindex, nofollow" />
<title>公告管理 · 风雨溯元</title>
<style>
  :root {
    --ink: #14303f;
    --muted: #718795;
    --line: rgba(20, 60, 80, .12);
    --accent: #1f6fae;
    --paper: #fff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: radial-gradient(900px 500px at 10% -6%, #e2f3fb 0%, rgba(226,243,251,0) 62%), #f4f9fc;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  header.page { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  header.page h1 { margin: 0; font-size: 20px; letter-spacing: .01em; }
  header.page p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  a.back { color: var(--accent); text-decoration: none; font-size: 13px; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 14px 34px rgba(18, 66, 96, .08); padding: 16px; margin-bottom: 16px; }
  .connect { display: grid; grid-template-columns: 1.4fr 1fr auto; gap: 10px; align-items: end; }
  label.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
  input, textarea, select, button { font: inherit; color: inherit; }
  input[type="url"], input[type="password"], input[type="text"], input[type="datetime-local"], textarea, select {
    width: 100%; min-height: 40px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 10px;
    background: #fbfdfe; outline: none;
  }
  input:focus-visible, textarea:focus-visible, select:focus-visible { border-color: #7fb2d5; box-shadow: 0 0 0 3px rgba(31,111,174,.12); }
  textarea { min-height: 96px; resize: vertical; }
  button { min-height: 40px; padding: 0 14px; border: 1px solid transparent; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: #fff; border-color: var(--line); color: var(--ink); }
  button.danger { background: #fff; border-color: rgba(190, 60, 60, .35); color: #b03d3d; }
  button:disabled { opacity: .55; cursor: default; }
  .hint { margin: 8px 0 0; font-size: 11.5px; color: var(--muted); line-height: 1.6; }
  .status { margin-top: 10px; font-size: 12.5px; color: var(--muted); min-height: 18px; }
  .status.error { color: #b03d3d; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .toolbar h2 { margin: 0; font-size: 15px; }
  .toolbar .count { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .toolbar .actions { display: flex; gap: 8px; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: #fcfdfe; }
  .item-head { display: flex; align-items: flex-start; gap: 10px; }
  .item-title { flex: 1; min-width: 0; font-size: 14px; line-height: 1.45; word-break: break-word; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .badge { font-size: 11px; line-height: 1; padding: 4px 8px; border-radius: 999px; background: #eef6fa; color: #33627f; }
  .badge.on { background: #e7f6ec; color: #2c7a45; }
  .badge.off { background: #f3f4f5; color: #77828a; }
  .badge.warn { background: #fdf3e4; color: #9a6412; }
  .badge.pin { background: #e8f0fb; color: #2a5ea8; }
  .item-meta { margin-top: 8px; font-size: 11.5px; color: var(--muted); line-height: 1.7; word-break: break-all; }
  .item-actions { display: flex; gap: 8px; margin-top: 10px; }
  .item-actions button { min-height: 34px; padding: 0 12px; font-size: 12.5px; }
  .empty { padding: 26px 10px; text-align: center; color: var(--muted); font-size: 13px; }
  dialog { border: 1px solid var(--line); border-radius: 18px; padding: 0; width: min(560px, calc(100vw - 28px)); box-shadow: 0 26px 70px rgba(15, 50, 75, .28); }
  dialog::backdrop { background: rgba(12, 35, 50, .38); }
  .editor { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .editor h3 { margin: 0; font-size: 16px; }
  .editor-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .editor-close { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; min-width: 30px; min-height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: #fff; color: var(--muted); cursor: pointer; }
  .editor-close:hover { border-color: #7fb2d5; background: #f2f8fc; color: var(--ink); }
  .editor-close:focus-visible { outline: 2px solid #7fb2d5; outline-offset: 2px; }
  .editor-close svg { width: 14px; height: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .checks { display: flex; gap: 18px; flex-wrap: wrap; }
  .checks label { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink); }
  .checks input { width: 18px; height: 18px; min-height: 0; }
  .colorbar { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fbfdfe; }
  .colorbar-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 11.5px; color: var(--muted); }
  .colorbar-head strong { flex: none; font-size: 12px; font-weight: 600; color: var(--ink); }
  .colorbar-row { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
  .swatch-list { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
  .swatch { width: 26px; height: 26px; min-width: 26px; min-height: 26px; padding: 0; border: 1px solid rgba(20, 60, 80, .18); border-radius: 50%; background: var(--swatch, #fff); cursor: pointer; }
  .swatch:hover { transform: scale(1.08); }
  .swatch:focus-visible { outline: 2px solid #7fb2d5; outline-offset: 2px; }
  .swatch-default { min-height: 26px; height: 26px; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--muted); font-size: 11.5px; cursor: pointer; }
  .swatch-default:hover { color: var(--ink); border-color: #7fb2d5; }
  input[type="color"] { width: 36px; height: 28px; min-height: 0; padding: 0 2px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; }
  .color-preview { max-height: 128px; overflow: auto; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 10px; background: #fff; font-size: 12.5px; line-height: 1.7; word-break: break-word; white-space: pre-wrap; }
  .color-preview:empty { display: none; }
  .preview-label { margin-right: 6px; font-size: 11px; color: var(--muted); }
  .editor-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  @media (max-width: 640px) {
    .connect { grid-template-columns: 1fr; }
    .grid2 { grid-template-columns: 1fr; }
    button { min-height: 44px; }
    .editor { padding: 16px 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <div>
      <h1>公告管理</h1>
      <p>风雨溯元 · CloudBase PostgreSQL</p>
    </div>
    <a class="back" href="./">返回首页</a>
  </header>

  <section class="card">
    <form class="connect" id="connectForm" novalidate>
      <label class="field">接口地址
        <input id="apiBase" type="url" placeholder="https://xxx.service.tcloudbase.com" autocomplete="off" spellcheck="false" />
      </label>
      <label class="field">管理口令
        <input id="adminToken" type="password" placeholder="ANNOUNCE_ADMIN_TOKEN" autocomplete="current-password" />
      </label>
      <button id="connectBtn" type="submit">连接</button>
    </form>
    <p class="hint">接口地址填 CloudBase HTTP 访问服务的根地址（不要带结尾斜杠），口令与云函数环境变量 ANNOUNCE_ADMIN_TOKEN 一致，只保存在当前标签页。</p>
    <p class="status" id="connectStatus"></p>
  </section>

  <section class="card" id="listCard" hidden>
    <div class="toolbar">
      <h2>公告列表 <span class="count" id="itemCount"></span></h2>
      <div class="actions">
        <button class="ghost" id="refreshBtn" type="button">刷新</button>
        <button id="createBtn" type="button">新增公告</button>
      </div>
    </div>
    <div class="list" id="itemList"></div>
  </section>
</div>

<dialog id="editorDialog">
  <form class="editor" id="editorForm">
    <div class="editor-head">
      <h3 id="editorTitle">新增公告</h3>
      <button class="editor-close" id="editorClose" type="button" aria-label="关闭编辑窗">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <label class="field">标题
      <input id="fTitle" type="text" maxlength="120" required />
    </label>
    <label class="field">正文（可选）
      <textarea id="fBody" maxlength="2000" placeholder="公告详情，仅管理页可见"></textarea>
    </label>
    <div class="colorbar">
      <div class="colorbar-head">
        <strong>文字颜色</strong>
        <span>选中标题或正文里的文字后点色块；颜色以标记保存，公告栏会自动渲染</span>
      </div>
      <div class="colorbar-row">
        <div class="swatch-list" id="swatchList"></div>
        <input id="customColor" type="color" value="#d33b3b" title="自定义颜色" aria-label="自定义颜色" />
        <button class="swatch-default" id="clearColor" type="button">恢复默认</button>
      </div>
      <div class="color-preview" id="colorPreview"></div>
    </div>
    <div class="grid2">
      <label class="field">级别
        <select id="fLevel">
          <option value="info">普通</option>
          <option value="warning">提醒</option>
        </select>
      </label>
      <label class="field">链接（可选）
        <input id="fUrl" type="url" maxlength="500" placeholder="https://..." />
      </label>
    </div>
    <div class="grid2">
      <label class="field">开始时间（可选）
        <input id="fStartsAt" type="datetime-local" />
      </label>
      <label class="field">结束时间（可选）
        <input id="fEndsAt" type="datetime-local" />
      </label>
    </div>
    <div class="checks">
      <label><input id="fPinned" type="checkbox" />置顶</label>
      <label><input id="fPublished" type="checkbox" checked />发布</label>
    </div>
    <p class="status error" id="editorStatus" hidden></p>
    <div class="editor-actions">
      <button class="ghost" id="cancelBtn" type="button">取消</button>
      <button id="saveBtn" type="submit">保存</button>
    </div>
  </form>
</dialog>

<script src="api-config.js"></script>
<script src="announcements-admin.js"></script>
</body>
</html>
